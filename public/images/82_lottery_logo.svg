<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Red Gradient -->
    <radialGradient id="redBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="60%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Star Shadow Filter -->
    <filter id="starShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- 3D Text Shadow Filter -->
    <filter id="textShadow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Rounded Square with Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="url(#redBg)" stroke="url(#goldBorder)" stroke-width="12" />

  <!-- 3D MULTI-COLORED ORIGAMI STAR -->
  <g filter="url(#starShadow)">
    <!-- Center Point around (256, 210) -->

    <!-- Top Arm: White/Silver with Shaded Facet -->
    <polygon points="256,210 256,70 390,130" fill="#f8fafc" />
    <polygon points="256,210 240,75 256,70" fill="#cbd5e1" />

    <!-- Top Right Arm: Bright Yellow with Golden Facet -->
    <polygon points="256,210 390,130 345,305" fill="#facc15" />
    <polygon points="256,210 345,305 325,245" fill="#eab308" />

    <!-- Bottom Arm: Vibrant Lime Green with Deep Green Facet -->
    <polygon points="256,210 355,330 180,335" fill="#84cc16" />
    <polygon points="256,210 180,335 256,290" fill="#4d7c0f" />

    <!-- Bottom Left Arm: Bright Cyan/Sky Blue with Shade -->
    <polygon points="256,210 145,215 165,340" fill="#06b6d4" />
    <polygon points="256,210 165,340 180,260" fill="#0891b2" />

    <!-- Top Left Arm: Royal Blue/Violet with Indigo Facet -->
    <polygon points="256,210 236,90 135,210" fill="#6366f1" />
    <polygon points="256,210 135,210 195,190" fill="#4338ca" />
  </g>

  <!-- 3D Extruded "82LOTTERY" Typography -->
  <!-- Dark Depth Layer for 3D bevel -->
  <g filter="url(#textShadow)">
    <text 
      x="256" 
      y="424" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="64" 
      fill="#475569" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      82LOTTERY
    </text>
    <!-- Mid Extrusion Layer -->
    <text 
      x="256" 
      y="420" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="64" 
      fill="#94a3b8" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      82LOTTERY
    </text>
    <!-- Crisp Top Metallic White Layer -->
    <text 
      x="256" 
      y="416" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="64" 
      fill="#ffffff" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      82LOTTERY
    </text>
  </g>
</svg>
