<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Blue Gradient -->
    <linearGradient id="blueBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0256fe" />
      <stop offset="100%" stop-color="#013ce0" />
    </linearGradient>

    <!-- Golden Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff566" />
      <stop offset="35%" stop-color="#ffd700" />
      <stop offset="70%" stop-color="#ffb700" />
      <stop offset="100%" stop-color="#e69500" />
    </linearGradient>

    <!-- Golden Highlight -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fff275" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#00186b" flood-opacity="0.8" />
    </filter>

    <filter id="diceShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="6" flood-color="#001250" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="url(#blueBg)" stroke="#2b75ff" stroke-width="4" />

  <!-- CENTRAL EMBLEM -->
  <g filter="url(#shadow)">
    <!-- Big Golden Letter "G" -->
    <path 
      d="M 345 130 C 310 100 250 100 190 145 C 130 195 110 270 140 345 C 175 420 270 435 340 385 C 385 350 400 305 400 260 L 260 260 L 260 210 L 440 210 C 445 270 430 360 365 415 C 280 480 150 460 90 360 C 40 265 65 170 140 105 C 220 35 320 45 390 95 Z" 
      fill="url(#goldGrad)" 
    />

    <!-- Dynamic Curved Golden Swoosh / Wing slicing across G -->
    <path 
      d="M 125 315 C 170 230 265 180 435 155 C 320 200 210 255 145 315 Z" 
      fill="url(#goldHighlight)" 
    />

    <!-- 3D Realistic Dice on the left of swoosh -->
    <g transform="translate(115, 185) rotate(-15)" filter="url(#diceShadow)">
      <!-- Top Face -->
      <polygon points="30,0 60,15 30,30 0,15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Left Face -->
      <polygon points="0,15 30,30 30,65 0,50" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Right Face -->
      <polygon points="30,30 60,15 60,50 30,65" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />

      <!-- Dice dots (black) -->
      <!-- Top dots -->
      <circle cx="30" cy="15" r="3" fill="#0f172a" />
      <!-- Left dots -->
      <circle cx="12" cy="32" r="2.5" fill="#0f172a" />
      <circle cx="20" cy="46" r="2.5" fill="#0f172a" />
      <!-- Right dots -->
      <circle cx="42" cy="38" r="2.5" fill="#0f172a" />
      <circle cx="50" cy="26" r="2.5" fill="#0f172a" />
      <circle cx="38" cy="50" r="2.5" fill="#0f172a" />
    </g>
  </g>

  <!-- "Goagames" Typography -->
  <g filter="url(#shadow)">
    <text 
      x="256" 
      y="435" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Georgia', serif" 
      font-weight="900" 
      font-size="52" 
      fill="#ffffff" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      Goagames
    </text>
  </g>
</svg>
