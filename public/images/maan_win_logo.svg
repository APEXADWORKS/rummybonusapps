<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="60%" stop-color="#050c18" />
      <stop offset="100%" stop-color="#02060d" />
    </radialGradient>

    <!-- Orange Diamond Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Ice Chrome Text Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="256" cy="256" r="248" fill="url(#darkBg)" stroke="#38bdf8" stroke-width="8" filter="url(#cyanGlow)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#0284c7" stroke-width="3" />

  <!-- Ambient Blue Lighting Rays in Background -->
  <path d="M 180 80 L 256 220 L 332 80" stroke="rgba(56, 189, 248, 0.15)" stroke-width="40" fill="none" />
  <circle cx="256" cy="230" r="140" fill="none" stroke="rgba(56, 189, 248, 0.1)" stroke-width="20" />

  <!-- Orange Double Rhombus / Chevron Emblem -->
  <g transform="translate(256, 120)" filter="url(#shadowHeavy)">
    <!-- Left Orange Rhombus -->
    <polygon points="-38,0 -8,-25 8,-5 -22,20" fill="url(#orangeGrad)" />
    <!-- Right Orange Rhombus -->
    <polygon points="-8,-25 22,-50 38,-30 8,-5" fill="url(#orangeGrad)" />
    <polygon points="-10,-5 20,-30 36,-10 6,15" fill="#f97316" />
    <polygon points="6,15 26,0 36,15 16,30" fill="#ea580c" />
  </g>

  <!-- Dynamic Curved Cyan Swoosh (Lower / Back Segment) -->
  <path 
    d="M 60 305 C 50 365 140 375 240 355 C 340 335 400 280 435 200 C 375 250 280 305 160 335 C 90 350 70 330 85 300 Z" 
    fill="#38bdf8" 
    filter="url(#cyanGlow)" 
  />

  <!-- 3D "MAAN" TYPOGRAPHY -->
  <g filter="url(#shadowHeavy)">
    <!-- Base Deep Shadow -->
    <text 
      x="250" 
      y="275" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="88" 
      fill="#031525" 
      stroke="#031525" 
      stroke-width="18" 
      text-anchor="middle" 
      letter-spacing="4"
    >
      MAAN
    </text>
    <!-- Cyan Glowing Stroke Layer -->
    <text 
      x="250" 
      y="275" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="88" 
      fill="#0284c7" 
      stroke="#38bdf8" 
      stroke-width="6" 
      text-anchor="middle" 
      letter-spacing="4"
    >
      MAAN
    </text>
    <!-- Ice Chrome Top Face -->
    <text 
      x="250" 
      y="275" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="88" 
      fill="url(#chromeGrad)" 
      text-anchor="middle" 
      letter-spacing="4"
    >
      MAAN
    </text>
  </g>

  <!-- 3D "WIN" TYPOGRAPHY (Bottom Right) -->
  <g filter="url(#shadowHeavy)">
    <text 
      x="330" 
      y="360" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="74" 
      fill="#031525" 
      stroke="#031525" 
      stroke-width="14" 
      text-anchor="middle" 
      letter-spacing="4"
    >
      WIN
    </text>
    <text 
      x="330" 
      y="360" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="74" 
      fill="#0284c7" 
      stroke="#38bdf8" 
      stroke-width="5" 
      text-anchor="middle" 
      letter-spacing="4"
    >
      WIN
    </text>
    <text 
      x="330" 
      y="360" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="74" 
      fill="url(#chromeGrad)" 
      text-anchor="middle" 
      letter-spacing="4"
    >
      WIN
    </text>
  </g>

  <!-- Front Dynamic Energy Swoosh Arc Cutting Across -->
  <path 
    d="M 55 310 C 100 240 220 200 420 185 C 330 220 220 270 120 330 C 80 350 60 335 55 310 Z" 
    fill="#bae6fd" 
    filter="url(#cyanGlow)" 
  />
  <path 
    d="M 120 330 C 230 270 330 215 425 183" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="6" 
    stroke-linecap="round"
  />
</svg>
