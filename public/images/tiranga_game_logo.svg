<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="70%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#04060b" />
    </radialGradient>

    <!-- Cyan Neon Gradient for T Swoosh -->
    <linearGradient id="cyanGrad" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Inner Subtle Outer Ring -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2" />

  <!-- STYLIZED 'T' EMBLEM -->
  <g transform="translate(10, 5)">
    <!-- Top White Bar of 'T' -->
    <path 
      d="M 145 180 L 335 180 C 342 180 348 184 345 192 L 330 226 C 327 232 321 236 314 236 L 210 236 L 195 285 L 145 180 Z" 
      fill="#ffffff" 
    />

    <!-- Cyan Curved Lower Swoosh of 'T' -->
    <path 
      d="M 210 236 C 245 220 305 210 338 200 C 275 270 215 350 178 372 C 185 340 205 270 210 236 Z" 
      fill="url(#cyanGrad)" 
      filter="url(#cyanGlow)"
    />

    <!-- Cyan Glowing Dot at Top Right -->
    <circle 
      cx="366" 
      cy="165" 
      r="24" 
      fill="#00f2fe" 
      filter="url(#cyanGlow)" 
    />
    <circle 
      cx="366" 
      cy="165" 
      r="16" 
      fill="#ffffff" 
      opacity="0.8"
    />
  </g>

  <!-- Bottom Glowing Typography: "TIRANGA GAMES" -->
  <g filter="url(#cyanGlow)">
    <text 
      x="256" 
      y="442" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
      font-weight="900" 
      font-size="34" 
      fill="#00e5ff" 
      text-anchor="middle" 
      letter-spacing="5"
    >
      TIRANGA GAMES
    </text>
  </g>
</svg>
