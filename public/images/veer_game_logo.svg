<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="emeraldDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011510" />
    </radialGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Chrome Metallic Gradient -->
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="55%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Emerald Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Glowing Rim -->
  <circle cx="256" cy="256" r="248" fill="url(#emeraldDark)" stroke="#10b981" stroke-width="6" filter="url(#emeraldGlow)" />
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#goldBorder)" stroke-width="8" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#047857" stroke-width="3" />

  <!-- CASINO ELEMENTS IN BACKGROUND -->
  <!-- Left Card: Ace of Spades -->
  <g transform="translate(100, 110) rotate(-20)" filter="url(#shadowHeavy)">
    <rect x="0" y="0" width="110" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <text x="18" y="32" font-family="sans-serif" font-weight="900" font-size="24" fill="#0f172a">A</text>
    <path d="M 20 40 C 14 48 20 54 26 50 C 32 54 38 48 32 40 L 26 34 Z M 24 50 L 28 50 L 26 56 Z" fill="#0f172a" />
    <path d="M 55 70 C 40 90 55 105 70 95 C 85 105 100 90 85 70 L 70 55 Z M 66 95 L 74 95 L 70 108 Z" fill="#0f172a" />
  </g>

  <!-- Right Card: Ace of Hearts -->
  <g transform="translate(300, 110) rotate(20)" filter="url(#shadowHeavy)">
    <rect x="0" y="0" width="110" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <text x="80" y="32" font-family="sans-serif" font-weight="900" font-size="24" fill="#dc2626">A</text>
    <path d="M 85 45 C 80 40 75 48 85 58 C 95 48 90 40 85 45 Z" fill="#dc2626" />
    <path d="M 55 75 C 40 60 25 80 55 110 C 85 80 70 60 55 75 Z" fill="#dc2626" />
  </g>

  <!-- Green Casino Poker Chip -->
  <g transform="translate(256, 210)" filter="url(#shadowHeavy)">
    <!-- Base Chip -->
    <circle cx="0" cy="0" r="105" fill="#059669" stroke="url(#goldBorder)" stroke-width="4" />
    <!-- White edge stripes -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#f8fafc" stroke-width="12" stroke-dasharray="24 24" />
    <!-- Inner Chip Rings -->
    <circle cx="0" cy="0" r="82" fill="#047857" stroke="#10b981" stroke-width="3" />
    <circle cx="0" cy="0" r="62" fill="#064e3b" stroke="url(#goldBorder)" stroke-width="3" />

    <!-- Center Silver Spade -->
    <g transform="scale(0.8) translate(-50, -60)">
      <path d="M 50 15 C 20 55 45 80 70 65 C 95 80 120 55 90 15 L 70 -10 Z" fill="#ffffff" filter="url(#emeraldGlow)" />
      <path d="M 64 65 L 76 65 L 70 85 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Golden Royal Crown atop Chip -->
  <g transform="translate(256, 115)" filter="url(#shadowHeavy)">
    <path 
      d="M -70 20 L -60 -20 L -25 5 L 0 -40 L 25 5 L 60 -20 L 70 20 Z" 
      fill="url(#goldBorder)" 
      stroke="#78350f" 
      stroke-width="2" 
    />
    <!-- Emerald in crown -->
    <polygon points="0,-25 10,-12 0,0 -10,-12" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="-60" cy="-22" r="5" fill="#fef08a" />
    <circle cx="60" cy="-22" r="5" fill="#fef08a" />
    <circle cx="0" cy="-42" r="6" fill="#fef08a" />
  </g>

  <!-- Side Gold Coins -->
  <g transform="translate(80, 240)" filter="url(#shadowHeavy)">
    <circle cx="0" cy="0" r="32" fill="url(#goldBorder)" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="0" r="26" fill="#eab308" />
  </g>
  <g transform="translate(432, 240)" filter="url(#shadowHeavy)">
    <circle cx="0" cy="0" r="32" fill="url(#goldBorder)" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="0" r="26" fill="#eab308" />
  </g>

  <!-- 3D "VEER.GAME" TYPOGRAPHY -->
  <g filter="url(#shadowHeavy)">
    <!-- Dark Backing Outline -->
    <text 
      x="256" 
      y="370" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="68" 
      fill="#022c22" 
      stroke="#022c22" 
      stroke-width="16" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      VEER.GAME
    </text>
    <!-- Green Neon Stroke Layer -->
    <text 
      x="256" 
      y="370" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="68" 
      fill="#0f172a" 
      stroke="#10b981" 
      stroke-width="8" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      VEER.GAME
    </text>
    <!-- Chrome Face -->
    <text 
      x="256" 
      y="370" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="68" 
      fill="url(#chromeText)" 
      text-anchor="middle" 
      letter-spacing="2"
    >
      VEER.GAME
    </text>
  </g>

  <!-- Lower Golden Emblem & Diamond -->
  <g transform="translate(256, 405)" filter="url(#shadowHeavy)">
    <path d="M -120 0 L -40 0 L 0 15 L 40 0 L 120 0" stroke="url(#goldBorder)" stroke-width="4" fill="none" />
    <polygon points="0,-12 16,0 0,12 -16,0" fill="url(#goldBorder)" />
    <polygon points="0,-8 10,0 0,8 -10,0" fill="#10b981" />
  </g>
</svg>
